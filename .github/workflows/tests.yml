name: Validate churn dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Train reference artifact explicitly
        run: python train.py
      - name: Validate calculations, contracts, persistence and interface
        run: python -m unittest discover -s tests -p 'test_*.py'
